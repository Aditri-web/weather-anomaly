# Data Configuration (MVP)
region:
  name: "Bay of Bengal & Odisha/West Bengal Coast"
  bbox: [10.0, 80.0, 25.0, 95.0]  # [min_lat, min_lon, max_lat, max_lon]

hazard: "cyclone_heavy_rain"
variable: "total_precipitation"
units: "mm/day"

resolution:
  input_deg: 0.25      # ERA5 / Coarse reanalysis input (~28 km)
  target_deg: 0.05     # CHIRPS / High-res target (~5 km)
  scale_factor: 5.0    # 0.25 / 0.05 = 5x
  neps_g_km: 12.0      # Planned NEPS-G resolution
  downscaled_km: 5.0   # Planned operational target

splits:
  train_years: [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018]
  val_years: [2019]
  test_years: [2020]   # Cyclone Amphan (May 2020) held-out test case
  held_out_events: ["cyclone_amphan_2020"]

sources:
  coarse_input: "era5_reanalysis"
  target_truth: "chirps_daily_0.05deg"
  forecast_ensemble: "synthetic_forecast"  # Switches to neps_g_12km when access available

paths:
  raw_era5: "data/raw/era5"
  raw_chirps: "data/raw/chirps"
  zarr_cache: "data/processed/zarr"
